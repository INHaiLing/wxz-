{% extends "admin/base_site.html" %}
{% block content %}
<div class="border border-base-200 rounded-default p-6 max-w-4xl dark:border-base-700">
  <p class="mb-4">原码只在本次生成响应提供一次。请妥善保存 CSV，然后打开批次详情确认已领取并启用。首次文件未保存时只能作废待领取批次后重新生成。</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button class="bg-primary-600 text-white px-4 py-2 rounded-default" type="submit">生成并一次下载 CSV</button></form>
  <a class="inline-block mt-4" href="{{ back_url }}">返回批次列表</a>
</div>
{% endblock %}
