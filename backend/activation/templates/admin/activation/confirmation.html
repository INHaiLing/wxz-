{% extends "admin/base_site.html" %}
{% block content %}
<div class="border border-base-200 rounded-default p-6 max-w-4xl dark:border-base-700">
  <p class="mb-4">{{ description }}</p>
  <dl class="mb-6">{% for label, value in details %}<dt class="font-semibold">{{ label }}</dt><dd class="mb-3">{{ value }}</dd>{% endfor %}</dl>
  {% if error %}<p class="text-red-600 mb-4" role="alert">本次操作未生效：{{ error }}</p>{% else %}
  <form method="post">{% csrf_token %}
    <input type="hidden" name="confirmation_token" value="{{ confirmation_token }}"><input type="hidden" name="confirm" value="yes">
    {% if need_reason %}<label for="reason" class="block mb-2">操作理由</label><textarea id="reason" name="reason" required maxlength="500" rows="4" class="border border-base-200 rounded-default w-full mb-4"></textarea>{% endif %}
    <button type="submit" class="bg-primary-600 text-white px-4 py-2 rounded-default">核对后确认</button>
  </form>{% endif %}
  <a class="inline-block mt-4" href="{{ back_url }}">返回详情重新核对</a>
</div>
{% endblock %}
